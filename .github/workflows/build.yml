name: Release

# Every push to main that passes CI publishes a macOS + Windows release.
# The version is bumped from the conventional commits since the last tag
# (breaking → major, feat → minor, anything else → patch) and written back to
# package.json, package-lock.json, Cargo.toml, Cargo.lock and tauri.conf.json.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto follows conventional commits)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      tag:
        description: 'Existing tag to rebuild and publish instead of bumping (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    # Only CI runs for pushes to this repository's main, never pull requests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Holds RELEASE_DEPLOY_KEY; its deployment branch policy only allows main.
    environment: release
    outputs:
      release: ${{ steps.existing.outputs.release || steps.push.outputs.release }}
      tag: ${{ steps.existing.outputs.tag || steps.bump.outputs.tag }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Manual recovery: rebuild an already pushed tag whose release is missing or a draft.
      - name: Use existing tag
        id: existing
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG is not an existing vX.Y.Z tag"; exit 1
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          {
            echo "release=true"
            echo "tag=$TAG"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version, commit and tag
        id: bump
        if: inputs.tag == ''
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          skip() { echo "$1"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # Release exactly the commit CI tested; a newer push gets its own run.
          if [ -n "$TESTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            skip "main moved past $TESTED_SHA; its own CI run will release it."
          fi
          if git log -1 --format=%s | grep -q '^chore(release): '; then
            skip "HEAD is already a release commit."
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          RANGE=${PREV_TAG:+$PREV_TAG..}HEAD
          if [ -n "$PREV_TAG" ] && [ "$BUMP" = auto ] &&
             [ -z "$(git diff --name-only "$PREV_TAG" HEAD -- . ':!*.md' ':!LICENSE' ':!.github/**')" ]; then
            skip "Only documentation or CI changed since $PREV_TAG; nothing to release."
          fi

          if [ "$BUMP" = auto ]; then
            LOG=$(git log "$RANGE" --no-merges --format='%s%n%b')
            if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<<"$LOG"; then BUMP="major"
            elif grep -qE '^feat(\([^)]*\))?:' <<<"$LOG"; then BUMP="minor"
            else BUMP="patch"; fi
          fi
          CURRENT=$(node -p "require('./package.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<<"${CURRENT%%-*}"
          case "$BUMP" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          echo "$CURRENT → $VERSION ($BUMP, commits ${PREV_TAG:-from the start})"

          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          node -e '
            const fs = require("fs"), file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          ' "$VERSION"
          perl -pi -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/ if !$done && /^version = /m && ($done = 1)' src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "ktcedit"\nversion = ")[^"]+/${1}'"$VERSION"'/' src-tauri/Cargo.lock
          git diff --stat
          [ "$(git diff --name-only | wc -l)" -eq 5 ] || { echo "::error::Expected 5 version files to change"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          {
            echo "ready=true"
            echo "tag=$TAG"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

      # The "Protect main" ruleset blocks direct pushes; only deploy keys bypass
      # it. The key exists only for this step and is removed on exit.
      - name: Push version commit and tag
        id: push
        if: steps.bump.outputs.ready == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::The release environment has no RELEASE_DEPLOY_KEY secret."; exit 1
          fi
          KEY="$RUNNER_TEMP/release_key"
          HOSTS="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$KEY"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$KEY")
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$HOSTS"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOSTS"
          if ! git push --atomic "git@github.com:$GITHUB_REPOSITORY.git" HEAD:main "refs/tags/$TAG"; then
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD~1)" ]; then
              echo "::warning::main moved during the release; the next CI run will release it."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Push to main was rejected; check that RELEASE_DEPLOY_KEY holds a write deploy key."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: draft
        if: steps.existing.outputs.release == 'true' || steps.push.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.existing.outputs.tag || steps.bump.outputs.tag }}
          PREV_TAG: ${{ steps.existing.outputs.prev_tag || steps.bump.outputs.prev_tag }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          cat > notes.md <<EOF
          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon and Intel) | \`ktcedit_${VERSION}_universal.dmg\` |
          | Windows | \`ktcedit_${VERSION}_x64-setup.exe\` (installer) or \`ktcedit_${VERSION}_x64_en-US.msi\` |

          The binary patches (visible coin limit, vagrant camps, warhorse collider) only work on Apple Silicon Macs.

          The builds are not signed by Apple or Microsoft:
          - **macOS**: if the app is reported as damaged or from an unidentified developer, allow it in System Settings → Privacy & Security, or run \`xattr -dr com.apple.quarantine /Applications/ktcedit.app\`.
          - **Windows**: in the SmartScreen prompt, choose **More info** → **Run anyway**.

          Close Kingdom Two Crowns and keep a separate copy of your \`global-v35\` save before editing.

          EOF
          # Reuse this tag's draft when rebuilding; never touch a published release.
          EXISTING=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -n 1)
          if [ -n "$EXISTING" ]; then
            read -r ID DRAFT <<<"$EXISTING"
            [ "$DRAFT" = true ] || { echo "::error::$TAG is already published"; exit 1; }
          else
            # Take the id from the creation response: a new draft can be missing
            # from the release list for a few seconds.
            GENERATED=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" ${PREV_TAG:+-f previous_tag_name="$PREV_TAG"} --jq .body)
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Kingdom Two Crowns Save Editor $TAG" \
              -F draft=true -f body="$(cat notes.md)$GENERATED" --jq .id)
          fi
          [ -n "$ID" ] || { echo "::error::Could not resolve the release id for $TAG"; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    # Holds the updater signing key (TAURI_SIGNING_PRIVATE_KEY and its password).
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - name: Windows
            platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.version.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft once every bundle is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.version.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true
