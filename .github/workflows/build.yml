name: Release

# Every push to main that passes CI publishes a macOS + Windows release.
# The version is bumped from the conventional commits since the last tag
# (breaking → major, feat → minor, anything else → patch) and written back to
# package.json, package-lock.json, Cargo.toml, Cargo.lock and tauri.conf.json.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto follows conventional commits)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    # Only CI runs for pushes to this repository's main, never pull requests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.bump.outputs.release }}
      tag: ${{ steps.bump.outputs.tag }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version, commit and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          skip() { echo "$1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # Release exactly the commit CI tested; a newer push gets its own run.
          if [ -n "$TESTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            skip "main moved past $TESTED_SHA; its own CI run will release it."
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          RANGE=${PREV_TAG:+$PREV_TAG..}HEAD
          if [ -n "$PREV_TAG" ] && [ "$BUMP" = auto ] &&
             [ -z "$(git diff --name-only "$PREV_TAG" HEAD -- . ':!*.md' ':!LICENSE')" ]; then
            skip "Only documentation changed since $PREV_TAG; nothing to release."
          fi

          if [ "$BUMP" = auto ]; then
            LOG=$(git log "$RANGE" --no-merges --format='%s%n%b')
            if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<<"$LOG"; then BUMP="major"
            elif grep -qE '^feat(\([^)]*\))?:' <<<"$LOG"; then BUMP="minor"
            else BUMP="patch"; fi
          fi
          CURRENT=$(node -p "require('./package.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<<"${CURRENT%%-*}"
          case "$BUMP" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          echo "$CURRENT → $VERSION ($BUMP, commits ${PREV_TAG:-from the start})"

          npm version "$VERSION" --no-git-tag-version
          node -e '
            const fs = require("fs"), file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          ' "$VERSION"
          perl -pi -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/ if !$done && /^version = /m && ($done = 1)' src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "ktcedit"\nversion = ")[^"]+/${1}'"$VERSION"'/' src-tauri/Cargo.lock
          git diff --stat
          [ "$(git diff --name-only | wc -l)" -eq 5 ] || { echo "::error::Expected 5 version files to change"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          if ! git push --atomic origin HEAD:main "refs/tags/$TAG"; then
            skip "::warning::main moved during the release; the next CI run will release it."
          fi
          {
            echo "release=true"
            echo "tag=$TAG"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: draft
        if: steps.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          PREV_TAG: ${{ steps.bump.outputs.prev_tag }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          cat > notes.md <<EOF
          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon and Intel) | \`ktcedit_${VERSION}_universal.dmg\` |
          | Windows | \`ktcedit_${VERSION}_x64-setup.exe\` (installer) or \`ktcedit_${VERSION}_x64_en-US.msi\` |

          The binary patches (visible coin limit, vagrant camps, warhorse collider) only work on Apple Silicon Macs.

          The builds are not signed by Apple or Microsoft:
          - **macOS**: if the app is reported as damaged or from an unidentified developer, allow it in System Settings → Privacy & Security, or run \`xattr -dr com.apple.quarantine /Applications/ktcedit.app\`.
          - **Windows**: in the SmartScreen prompt, choose **More info** → **Run anyway**.

          Close Kingdom Two Crowns and keep a separate copy of your \`global-v35\` save before editing.

          EOF
          gh release create "$TAG" --draft --verify-tag \
            --title "Kingdom Two Crowns Save Editor $TAG" \
            --notes-file notes.md --generate-notes ${PREV_TAG:+--notes-start-tag "$PREV_TAG"}
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - name: Windows
            platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.version.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft once every bundle is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.version.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true
